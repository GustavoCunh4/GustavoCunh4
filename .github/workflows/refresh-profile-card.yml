name: Refresh profile card

on:
  schedule:
    - cron: "18 8 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/render_profile_card.py"
      - ".github/workflows/refresh-profile-card.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pillow

      - name: Render SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/render_profile_card.py

      - name: Commit refreshed cards
        run: |
          if git diff --quiet -- dark_mode.svg light_mode.svg; then
            echo "No profile card changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git commit -m "chore: refresh profile card"
          git push
