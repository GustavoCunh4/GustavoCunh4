name: Build README card

on:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/build_profile.py"
      - ".github/workflows/build-readme.yml"
      - "README.md"
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pillow

      - name: Generate profile card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/build_profile.py

      - name: Commit generated SVG
        run: |
          if git diff --quiet -- dark_mode.svg light_mode.svg; then
            echo "No SVG changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git commit -m "chore: rebuild profile card"
          git push
